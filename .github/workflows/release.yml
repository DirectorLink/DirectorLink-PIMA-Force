name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match VERSION
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION file ($VERSION)"
            exit 1
          fi
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Tests and build
        run: python tools/build.py
      - name: The packaged script against a simulated panel
        run: DRIVER_LUA=dist/driver.lua lua5.1 tests/test_driver.lua && DRIVER_LUA=dist/driver.lua lua5.1 tests/test_sia.lua
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          NOTES="docs/releases/v$VERSION.md"
          ARGS=(--title "DirectorLink · PIMA FORCE $VERSION")
          if [ -f "$NOTES" ]; then ARGS+=(--notes-file "$NOTES"); else ARGS+=(--generate-notes); fi
          case "$VERSION" in *-*) ARGS+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/DirectorLink-PIMA-Force.c4z dist/SHA256SUMS.txt "${ARGS[@]}"
